version: '3.8'

services:
  # Service 1: Banco de Dados MySQL
  mysql_db:
    image: mysql:8.0
    container_name: taskrunning_mysql
    restart: always
    environment:
      MYSQL_DATABASE: taskrunning_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service 2: API Spring Boot Backend
  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskrunning_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db:3306/taskrunning_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: minhasuperchavesecretadotaskrunning2026
    depends_on:
      mysql_db:
        condition: service_healthy

volumes:
  mysql_data: