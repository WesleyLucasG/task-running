server:
  port: 8080

spring:
  application:
    name: task-running-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/task_running_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:sua_senha_local}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  api:
    security:
      token:
        secret: ${JWT_SECRET:chave-secreta-padrao-desenvolvimento-task-running-2026}