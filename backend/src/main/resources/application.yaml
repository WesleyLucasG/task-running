server:
  port: 8080

spring:
  application:
    name: task-running-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/task_running_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:sua_senha_local}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Lido por TokenService (api.security.token.secret). Antes estava dentro de "spring:",
# por isso nunca era encontrado e a API assinava tokens com a chave padrão do código.
api:
  security:
    token:
      secret: ${JWT_SECRET:chave-secreta-padrao-desenvolvimento-task-running-2026}

# RNF06: chave da criptografia do CPF (AES-GCM) e do hash de busca (HMAC-SHA256).
# O valor padrão serve SOMENTE para desenvolvimento local; em produção use CPF_SECRET.
app:
  seguranca:
    cpf-chave: ${CPF_SECRET:dev-somente-local-troque-em-producao}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}
  email:
    habilitado: false  # Em produção (application-prod.yaml) fica true e requer MAIL_HOST/USER/PASS
